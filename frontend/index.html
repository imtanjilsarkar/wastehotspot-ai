<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WasteHotspot AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>WasteHotspot AI</h1>
    <p>Upload a waste photo and let AI detect it.</p>
  </header>

  <main>
    <section class="upload-card">
      <input type="file" id="fileInput" accept="image/*" />
      <label class="check">
        <input type="checkbox" id="tiledCheck" checked />
        Deep scan (slower, finds more small items)
      </label>
      <button id="detectBtn">Detect Waste</button>
    </section>

    <section id="previewSection" class="hidden">
      <h2>Uploaded Image</h2>
      <div class="preview-wrap">
        <img id="preview" alt="Preview" />
        <canvas id="overlay"></canvas>
      </div>
    </section>

    <section id="resultSection" class="hidden">
      <h2>Detection Results</h2>
      <p><strong>Total items:</strong> <span id="totalCount">0</span></p>
      <div class="slider-row">
        <label for="confSlider">Confidence threshold: <strong id="confValue">25%</strong></label>
        <input type="range" id="confSlider" min="10" max="90" value="25" />
      </div>
      <ul id="countsList"></ul>
    </section>

    <section id="loadingSection" class="hidden">
      <p>Analyzing image...</p>
    </section>

    <section id="errorSection" class="hidden">
      <p id="errorMsg"></p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

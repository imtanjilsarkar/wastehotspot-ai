<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WasteHotspot AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>WasteHotspot AI</h1>
    <p>Upload a waste photo, tag its location, and detect waste with AI.</p>
    <nav>
      <a href="/" class="active">Upload</a>
      <a href="/map">Map</a>
    </nav>
  </header>

  <main>
    <!-- Location Section -->
    <section class="location-card">
      <h2>📍 Location</h2>
      <div class="location-controls">
        <button id="gpsBtn" type="button">Use My Location</button>
        <span id="locationStatus">No location set</span>
      </div>
      <div class="manual-location">
        <label>
          Latitude
          <input type="number" id="latInput" step="0.000001" placeholder="23.8103" />
        </label>
        <label>
          Longitude
          <input type="number" id="lngInput" step="0.000001" placeholder="90.4125" />
        </label>
      </div>
    </section>

    <!-- Upload Section -->
    <section class="upload-card">
      <h2>📷 Upload Image</h2>
      <input type="file" id="fileInput" accept="image/*" />
      <button id="detectBtn" type="button">Detect & Report</button>
    </section>

    <!-- Preview -->
    <section id="previewSection" class="hidden">
      <h2>Uploaded Image</h2>
      <img id="preview" alt="Preview" />
    </section>

    <!-- Loading -->
    <section id="loadingSection" class="hidden">
      <p>Analyzing image...</p>
    </section>

    <!-- Error -->
    <section id="errorSection" class="hidden">
      <p id="errorMsg"></p>
    </section>

    <!-- Detection Results -->
    <section id="resultSection" class="hidden">
      <h2>Detection Results</h2>
      <p><strong>Total items:</strong> <span id="totalCount">0</span></p>
      <p><strong>Severity:</strong> <span id="severityLabel">-</span></p>
      <ul id="countsList"></ul>
      <a href="/map" class="map-link">View on Map →</a>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
